<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prijava - ISA Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card">
    <h1>ISA Library</h1>
    <p class="muted">Spring MVC zavrsni projekat</p>

    <div class="alert error" th:if="${param.error}">Pogresno korisnicko ime ili lozinka.</div>
    <div class="alert success" th:if="${param.logout}">Uspesno ste se odjavili.</div>
    <div class="alert error" th:if="${param.expired}">Sesija je istekla. Prijavite se ponovo.</div>

    <form th:action="@{/login}" method="post">
        <label>Korisnicko ime</label>
        <input type="text" name="username" required autofocus>

        <label>Lozinka</label>
        <input type="password" name="password" required>

        <button type="submit">Prijavi se</button>
    </form>

    <div class="demo-box">
        <strong>Demo nalozi</strong><br>
        admin / admin123<br>
        user / user123
    </div>
</div>
</body>
</html>
